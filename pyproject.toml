[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pint-live"
version = "0.1.0"
description = "Automated network documentation — pull live switch data and export clean Excel workbooks"
requires-python = ">=3.10"
dependencies = [
    "netmiko>=4.3",
    "openpyxl>=3.1",
    "customtkinter>=5.2",
]

[project.scripts]
pint-live = "pint_live.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pint_live*"]
